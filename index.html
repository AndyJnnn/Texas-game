<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>德州扑克</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>德州扑克</h1>
      <p class="sub">无限注 · 四人桌 · 小盲 10 / 大盲 20</p>
    </div>
    <p id="meta"></p>
  </header>
  <div class="rail" id="table">
    <div class="felt"><p class="loading">洗牌…</p></div>
  </div>
  <p id="rank"></p>
  <ol id="log"></ol>
  <div id="controls"></div>
  <p class="hint">快捷键：F 弃牌，C 或空格 过牌/跟注，Enter 确认加注。<br>摊牌后按 Enter 开下一手。</p>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
